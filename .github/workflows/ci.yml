name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      - name: Run Bats
        run: bats tests
      - name: Check Bash syntax
        run: find . -type f \( -name '*.sh' -o -name '*.bash' \) -not -path './.git/*' -print0 | xargs -0 -r -n1 bash -n
      - name: Run ShellCheck
        run: find . -type f \( -name '*.sh' -o -name '*.bash' \) -not -path './.git/*' -print0 | xargs -0 -r shellcheck
